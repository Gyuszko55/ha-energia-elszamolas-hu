# Mérőóra-leolvasás, mérőcsere és napló (A1 főmérő, H-tarifa mérő, gázmérő).
# Óraállások: sensor.meroora_allas (A), sensor.meroora_allas_h (H), sensor.gaz_meroora_allas (G) – hu_energia_forrasok.yaml.
#
# Beviteli mezők (mérőnként): leolvasás dátuma, leolvasott óraállás, korrekció (±),
# mérőcserénél az új óra kezdőállása. Közös: a bejegyzés típusa (Éves leolvasás / Mérőcsere).
#
# A „Mehet” (script.meroora_leolvasas_mehet), mérőnként:
#   - korrekció → hozzáadja a képlet-eltoláshoz (a HA a valódi órát mutassa), majd 0;
#   - Éves leolvasás → a leolvasott állás lesz az új éves elszámolás alapja, a lezárt
#     időszak fogyasztása a naplóba kerül;
#   - Mérőcsere → a leolvasott állás a LESZERELT óra végállása. A különbség
#     (új kezdőállás − régi végállás) bekerül a képlet-eltolásba (az óraállás az új
#     órát mutatja), ÉS a „csere összesen” számlálóba, amit az éves fogyasztás és a
#     H-tarifás téli/nyári bontás kivon — így a csere a fogyasztást nem változtatja;
#   - minden bejegyzés a naplóba (sensor.meroora_leolvasasi_naplo) és a
#     /config/energia_elszamolas/naplo.csv fájlba kerül, a beviteli mezők kiürülnek.
#   - Ha a dátum régebbi a mostani éves alapnál, a bejegyzés csak a naplóba kerül (utólagos felvitel).

# Mérőnkénti jelölés: a „Mehet” csak a bejelölt mérőt dolgozza fel, utána a jelölést törli.
input_boolean:
  meroora_rogzit_a:
    name: "Rögzítés – A főmérő"
    icon: mdi:checkbox-marked-circle-outline
  meroora_rogzit_h:
    name: "Rögzítés – H-tarifa"
    icon: mdi:checkbox-marked-circle-outline
  meroora_rogzit_g:
    name: "Rögzítés – Gázmérő"
    icon: mdi:checkbox-marked-circle-outline

# H-tarifa téli/nyári bontás tartós állapota (hu_energia_forrasok.yaml: energy_h_teli / energy_h_nyari).
# Kezdőértékét az „Energia-elszámolás – első beállítás” szkript adja.
# JSON: {"teli": a téli regiszter a szakasz elején, "nyari": a nyári a szakasz elején,
#        "sz": a folytonos H-számláló (óraállás − cserék) a szakasz elején, "szak": "teli"/"nyari"}.
# Az aktív regiszter = alapja + (számláló − sz), a másik áll. Egyetlen mezőben, hogy a váltás
# egy lépésben (ugrás nélkül) történjen, és újraindítás/újratöltés után se vesszen el.
input_text:
  h_tarifa_szakasz:
    name: "H-tarifa téli/nyári szakasz-állapot"
    max: 255
    icon: mdi:swap-vertical

automation:
  - id: h_tarifa_szakaszvaltas
    alias: "H-tarifa – téli/nyári szakaszváltás"
    description: >-
      Amikor a binary_sensor.h_tariff_season vált (okt. 15. / ápr. 15.), a lezárt szakasz
      regiszterét rögzíti és a másikat indítja (input_text.h_tarifa_szakasz). Induláskor és
      óránként is ellenőriz, ha a váltás a HA leállása alatt történt.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.h_tariff_season
        to: ["on", "off"]
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: 7
    conditions:
      - condition: template
        value_template: >-
          {% set j = states('input_text.h_tarifa_szakasz') %}
          {{ j.startswith('{') and states('sensor.meroora_allas_h') | is_number
             and states('binary_sensor.h_tariff_season') in ['on', 'off']
             and is_state('binary_sensor.h_tariff_season', 'on') != ((j | from_json).szak == 'teli') }}
    actions:
      - variables:
          j: "{{ states('input_text.h_tarifa_szakasz') | from_json }}"
          total: >-
            {{ states('sensor.meroora_allas_h') | float - states('input_number.villany_h_csere_ossz') | float(0) }}
          aktiv: "{{ total - j.sz | float }}"
          uj: >-
            {% if j.szak == 'nyari' %}
              {{ {'teli': j.teli, 'nyari': (j.nyari + aktiv) | round(1), 'sz': total | round(1), 'szak': 'teli'} | to_json }}
            {% else %}
              {{ {'teli': (j.teli + aktiv) | round(1), 'nyari': j.nyari, 'sz': total | round(1), 'szak': 'nyari'} | to_json }}
            {% endif %}
      - action: input_text.set_value
        target:
          entity_id: input_text.h_tarifa_szakasz
        data:
          # a változó dict-ként jön vissza; JSON-ként kell a mezőbe
          value: "{{ (uj if uj is mapping else uj | from_json) | to_json }}"
      - action: logbook.log
        data:
          name: "H-tarifa"
          message: "Szakaszváltás: {{ (uj if uj is mapping else uj | from_json) | to_json }}"

