shell_command:
  meroora_naplo_csv: >-
    sh /config/energia_elszamolas/naplo.sh {{ datum }} {{ mero }} {{ tipus }} {{ allas }}
    {{ uj_kezdo }} {{ korrekcio }} {{ ha_elotte }} {{ lezart }}

template:
  - sensor:
      # H-tarifa éves fogyasztás szezononként (az utolsó éves leolvasás óta).
      - name: "H mérő éves téli fogyasztás"
        unique_id: meroora_allas_h_eves_teli
        default_entity_id: sensor.meroora_allas_h_eves_teli
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:snowflake
        availability: >-
          {{ states('sensor.energy_h_teli') | is_number and states('input_number.villany_h_eves_teli_bazis') | is_number
             and states('input_number.villany_h_eves_bazis') | float(0) > 0 }}
        state: >-
          {{ [(states('sensor.energy_h_teli') | float - states('input_number.villany_h_eves_teli_bazis') | float), 0] | max | round(1) }}
        attributes:
          elszamolas_kezdete: "{{ states('input_datetime.villany_h_eves_bazis_datum') }}"
          regiszter_1_81: "{{ states('sensor.energy_h_teli') }}"

      - name: "H mérő éves nyári fogyasztás"
        unique_id: meroora_allas_h_eves_nyari
        default_entity_id: sensor.meroora_allas_h_eves_nyari
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:white-balance-sunny
        availability: >-
          {{ states('sensor.energy_h_nyari') | is_number and states('input_number.villany_h_eves_nyari_bazis') | is_number
             and states('input_number.villany_h_eves_bazis') | float(0) > 0 }}
        state: >-
          {{ [(states('sensor.energy_h_nyari') | float - states('input_number.villany_h_eves_nyari_bazis') | float), 0] | max | round(1) }}
        attributes:
          elszamolas_kezdete: "{{ states('input_datetime.villany_h_eves_bazis_datum') }}"
          regiszter_1_82: "{{ states('sensor.energy_h_nyari') }}"

      - name: "H mérő éves fogyasztás"
        unique_id: meroora_allas_h_eves
        default_entity_id: sensor.meroora_allas_h_eves
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:heat-pump-outline
        availability: >-
          {{ states('input_number.villany_h_eves_bazis') | float(0) > 0
             and states('sensor.meroora_allas_h') | is_number }}
        state: >-
          {{ (states('sensor.meroora_allas_h') | float
              - states('input_number.villany_h_csere_ossz') | float(0)
              - states('input_number.villany_h_eves_bazis') | float) | round(0) }}
        attributes:
          elszamolas_kezdete: "{{ states('input_datetime.villany_h_eves_bazis_datum') }}"
          alap_oraallas: >-
            {% set e = state_attr('sensor.meroora_leolvasasi_naplo', 'bejegyzesek') or [] %}
            {% set ev = e | selectattr('mero', 'eq', 'H') | selectattr('tipus', 'eq', 'Éves leolvasás') | sort(attribute='datum') | list %}
            {{ ev[-1].allas if ev else none }}
          elozo_idoszak_fogyasztas: >-
            {% set e = state_attr('sensor.meroora_leolvasasi_naplo', 'bejegyzesek') or [] %}
            {% set ev = e | selectattr('mero', 'eq', 'H') | selectattr('tipus', 'eq', 'Éves leolvasás') | sort(attribute='datum') | list %}
            {{ ev[-1].lezart_fogyasztas if ev else none }}

      - name: "A mérő eltérés a leolvasástól"
        unique_id: villany_a_elteres
        default_entity_id: sensor.a_mero_elteres_a_leolvasastol
        unit_of_measurement: kWh
        icon: mdi:compare-horizontal
        availability: "{{ states('input_number.villany_a_leolvasas_allas') | float(0) > 0 and states('sensor.meroora_allas') | is_number }}"
        state: "{{ (states('input_number.villany_a_leolvasas_allas') | float - states('sensor.meroora_allas') | float) | round(0) }}"

      - name: "H mérő eltérés a leolvasástól"
        unique_id: villany_h_elteres
        default_entity_id: sensor.h_mero_elteres_a_leolvasastol
        unit_of_measurement: kWh
        icon: mdi:compare-horizontal
        availability: "{{ states('input_number.villany_h_leolvasas_allas') | float(0) > 0 and states('sensor.meroora_allas_h') | is_number }}"
        state: "{{ (states('input_number.villany_h_leolvasas_allas') | float - states('sensor.meroora_allas_h') | float) | round(0) }}"

      - name: "Gázmérő eltérés a leolvasástól"
        unique_id: gaz_elteres
        default_entity_id: sensor.gaz_mero_elteres_a_leolvasastol
        unit_of_measurement: m³
        icon: mdi:compare-horizontal
        availability: "{{ states('input_number.gaz_leolvasas_allas') | float(0) > 0 and states('sensor.gaz_meroora_allas') | is_number }}"
        state: "{{ (states('input_number.gaz_leolvasas_allas') | float - states('sensor.gaz_meroora_allas') | float) | round(1) }}"

  # Napló: minden „Mehet”-bejegyzés egy listában (a HA újraindításkor visszaállítja).
  # Állapot = bejegyzések száma. Törlés: esemény meroora_leolvasas_torles, data: rogzitve.
  - trigger:
      - trigger: event
        event_type: meroora_leolvasas_rogzites
        id: uj
      - trigger: event
        event_type: meroora_leolvasas_torles
        id: torol
    sensor:
      - name: "Mérőleolvasási napló"
        unique_id: meroora_leolvasasi_naplo
        default_entity_id: sensor.meroora_leolvasasi_naplo
        icon: mdi:notebook-outline
        state: >-
          {% set e = (this.attributes.bejegyzesek if this.attributes.bejegyzesek is defined else []) | list %}
          {% if trigger.id == 'uj' %}{{ e | count + 1 }}
          {% else %}{{ e | rejectattr('rogzitve', 'eq', trigger.event.data.rogzitve) | list | count }}{% endif %}
        attributes:
          bejegyzesek: >-
            {% set e = (this.attributes.bejegyzesek if this.attributes.bejegyzesek is defined else []) | list %}
            {% if trigger.id == 'uj' %}{{ e + [trigger.event.data.bejegyzes] }}
            {% else %}{{ e | rejectattr('rogzitve', 'eq', trigger.event.data.rogzitve) | list }}{% endif %}

script:
  meroora_leolvasas_mehet:
    alias: "Mérőleolvasás – Mehet"
    icon: mdi:check-circle-outline
    description: >-
      A két villanyóra és a gázóra beírt adatait alkalmazza (éves leolvasás vagy mérőcsere, korrekció),
      naplózza, majd kiüríti a beviteli mezőket és frissíti a szenzorokat.
    mode: single
    sequence:
      - variables:
          tipus_valasztott: "{{ states('input_select.villany_leolvasas_tipus') }}"
      - repeat:
          for_each:
            - { m: "a", p: "villany_a", szenzor: "sensor.meroora_allas", d: 0 }
            - { m: "h", p: "villany_h", szenzor: "sensor.meroora_allas_h", d: 0 }
            - { m: "g", p: "gaz", szenzor: "sensor.gaz_meroora_allas", d: 3 }
          sequence:
            - variables:
                m: "{{ repeat.item.m }}"
                p: "{{ repeat.item.p }}"
                d: "{{ repeat.item.d }}"
                szenzor: "{{ repeat.item.szenzor }}"
                korr: "{{ states('input_number.' ~ p ~ '_korrekcio') | float(0) | round(d) }}"
                allas: "{{ states('input_number.' ~ p ~ '_leolvasas_allas') | float(0) | round(d) }}"
                uj: "{{ states('input_number.' ~ p ~ '_uj_ora_kezdo') | float(0) | round(d) }}"
                datum: "{{ states('input_datetime.' ~ p ~ '_leolvasas_datum') }}"
                eltolas: "{{ states('input_number.' ~ p ~ '_eltolas') | float(0) }}"
                cs: "{{ states('input_number.' ~ p ~ '_csere_ossz') | float(0) }}"
                bazis: "{{ states('input_number.' ~ p ~ '_eves_bazis') | float(0) }}"
                bazis_datum: "{{ states('input_datetime.' ~ p ~ '_eves_bazis_datum') }}"
                ha_elotte: "{{ states(szenzor) | float(0) | round(d) }}"
                tipus: >-
                  {# Csak a bejelölt mérővel foglalkozunk (a csere/leolvasás mérőóránként külön érvényes). #}
                  {{ 'nincs' if not is_state('input_boolean.meroora_rogzit_' ~ m, 'on')
                     else (tipus_valasztott if allas > 0 else ('Korrekció' if korr != 0 else 'nincs')) }}
                # Utólagos (visszamenőleges) bejegyzés: a dátum régebbi a mostani éves alapnál →
                # csak naplóba kerül, az alapot/eltolást/cserét nem módosítja (a korrekciót igen).
                utolagos: >-
                  {{ tipus in ['Éves leolvasás', 'Mérőcsere'] and bazis > 0
                     and bazis_datum not in ['unknown', 'unavailable', ''] and datum < bazis_datum }}
                elozo: >-
                  {% set e = state_attr('sensor.meroora_leolvasasi_naplo', 'bejegyzesek') or [] %}
                  {% set ev = e | selectattr('mero', 'eq', m | upper) | selectattr('tipus', 'eq', 'Éves leolvasás')
                     | selectattr('datum', 'lt', datum) | sort(attribute='datum') | list %}
                  {{ ev[-1] if ev else none }}
                csere_delta: "{{ (uj - allas) if tipus == 'Mérőcsere' and not utolagos else 0 }}"
                lezart: >-
                  {% if tipus != 'Éves leolvasás' %}{{ none }}
                  {% elif utolagos %}{{ (allas - elozo.allas) | round(d) if elozo is mapping and elozo.allas is number else none }}
                  {% else %}{{ ((allas - cs) - bazis) | round(d) if bazis > 0 else none }}{% endif %}
            - if: "{{ tipus != 'nincs' }}"
              then:
                - if: "{{ korr != 0 or csere_delta != 0 }}"
                  then:
                    - action: input_number.set_value
                      target:
                        entity_id: "input_number.{{ p }}_eltolas"
                      data:
                        value: "{{ (eltolas + korr + csere_delta) | round(3) }}"
                - if: "{{ csere_delta != 0 }}"
                  then:
                    - action: input_number.set_value
                      target:
                        entity_id: "input_number.{{ p }}_csere_ossz"
                      data:
                        value: "{{ (cs + csere_delta) | round(3) }}"
                - if: "{{ tipus == 'Éves leolvasás' and not utolagos }}"
                  then:
                    - action: input_number.set_value
                      target:
                        entity_id: "input_number.{{ p }}_eves_bazis"
                      data:
                        value: "{{ allas - cs }}"
                    - if: "{{ datum not in ['unknown', 'unavailable', ''] }}"
                      then:
                        - action: input_datetime.set_datetime
                          target:
                            entity_id: "input_datetime.{{ p }}_eves_bazis_datum"
                          data:
                            date: "{{ datum }}"
                    # H: a téli/nyári regiszter a leolvasás pillanatában (a szezononkénti éves értékhez)
                    - if: "{{ m == 'h' and states('input_text.h_tarifa_szakasz').startswith('{') }}"
                      then:
                        - variables:
                            j: "{{ states('input_text.h_tarifa_szakasz') | from_json }}"
                            hsp: "{{ allas - cs }}"
                        - action: input_number.set_value
                          target:
                            entity_id: input_number.villany_h_eves_teli_bazis
                          data:
                            value: "{{ (j.teli + ((hsp - j.sz) if j.szak == 'teli' else 0)) | round(1) }}"
                        - action: input_number.set_value
                          target:
                            entity_id: input_number.villany_h_eves_nyari_bazis
                          data:
                            value: "{{ (j.nyari + ((hsp - j.sz) if j.szak == 'nyari' else 0)) | round(1) }}"
                - variables:
                    bejegyzes:
                      rogzitve: "{{ now().strftime('%Y-%m-%d %H:%M:%S') ~ '-' ~ m }}"
                      datum: "{{ datum }}"
                      mero: "{{ m | upper }}"
                      tipus: "{{ tipus }}"
                      allas: "{{ (allas if d else allas | int) if allas > 0 else none }}"
                      uj_kezdo: "{{ (uj if d else uj | int) if tipus == 'Mérőcsere' else none }}"
                      korrekcio: "{{ korr if d else korr | int }}"
                      ha_elotte: "{{ ha_elotte if d else ha_elotte | int }}"
                      lezart_fogyasztas: "{{ (lezart if d else lezart | int) if lezart is number else none }}"
                      idoszak_kezdete: >-
                        {{ (elozo.datum if elozo is mapping else none) if utolagos
                           else (bazis_datum if lezart is number else none) }}
                      utolag: "{{ utolagos }}"
                - event: meroora_leolvasas_rogzites
                  event_data:
                    bejegyzes: "{{ bejegyzes }}"
                - action: shell_command.meroora_naplo_csv
                  continue_on_error: true
                  data:
                    datum: "{{ datum }}"
                    mero: "{{ m | upper }}"
                    tipus: "{{ {'Éves leolvasás': 'eves', 'Mérőcsere': 'csere', 'Korrekció': 'korrekcio'}[tipus] }}"
                    allas: "{{ allas if d else allas | int }}"
                    uj_kezdo: "{{ (uj if d else uj | int) if tipus == 'Mérőcsere' else '-' }}"
                    korrekcio: "{{ korr if d else korr | int }}"
                    ha_elotte: "{{ ha_elotte if d else ha_elotte | int }}"
                    lezart: "{{ (lezart if d else lezart | int) if lezart is number else '-' }}"
                - action: input_number.set_value
                  target:
                    entity_id:
                      - "input_number.{{ p }}_korrekcio"
                      - "input_number.{{ p }}_leolvasas_allas"
                      - "input_number.{{ p }}_uj_ora_kezdo"
                  data:
                    value: 0
                - action: input_boolean.turn_off
                  target:
                    entity_id: "input_boolean.meroora_rogzit_{{ m }}"
                - delay: 1
      - action: input_select.select_option
        target:
          entity_id: input_select.villany_leolvasas_tipus
        data:
          option: "Éves leolvasás"
      - delay: 1
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.meroora_allas
            - sensor.meroora_allas_h
            - sensor.meroora_allas_eves
            - sensor.meroora_allas_h_eves
            - sensor.energy_h_teli
            - sensor.energy_h_nyari
            - sensor.gaz_meroora_allas
            - sensor.gaz_meroora_allas_eves
