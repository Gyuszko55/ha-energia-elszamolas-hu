azonosito: viz/egyedi
nev: "Víz- és csatornadíj (egyedi)"
kozmu: viz
egyseg: m3
# Nincs országos vízdíj: a helyi vízmű díjait a fiókban, felülírással kell megadni
# (hu_rezsi.feluliras: dijak.viz_m3, dijak.csatorna_m3, dijak.alapdij_ho – bruttó Ft).
verziok:
  - ervenyes_tol: 2000-01-01
    forras: "Sablon – a díjakat a helyi vízmű számlájáról kell megadni"
    ellenorzes:
      allapot: sablon
      datum: 2026-10-04
      mivel: "sablon – a díjakat a helyi vízmű számlájáról kell megadni"
    szabalyok:
      keret: {tipus: nincs}
      mennyiseg_egesz: true
      mennyiseg_minimum: 1   # számlánként legalább 1 m³ (víz és csatorna) – üdülőnél (sajátos számlázás) nem
      # A locsolási almérő levonása a csatornadíjból csak a locsolási idényben (58/2013. Korm. rendelet).
      almero_idoszak: {tol: "05-01", ig: "10-01"}    # a számla egész m³-re (lefelé) kerekített óraállások különbségével számol
      ar: viz_m3
      csatornadij: {alapertelmezes: be}
      alapdij:
        mod: idoszakonkent
    dijak:
      alap:                    # BRUTTÓ Ft (felülírással add meg)
        viz_m3: 0
        csatorna_m3: 0
        alapdij_ho: 0
