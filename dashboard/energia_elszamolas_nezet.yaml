    - type: heading
      heading: Leolvasási napló
      heading_style: subtitle
      icon: mdi:notebook-outline
    - type: entities
      entities:
      - entity: input_select.villany_naplo_szuro
        name: Szűrő
    - type: custom:html-template-card
      ignore_line_breaks: true
      content: |-
        {%- set sz = states('input_select.villany_naplo_szuro') -%}
        {%- set e = state_attr('sensor.meroora_leolvasasi_naplo', 'bejegyzesek') or [] -%}
        {%- set osszes = e -%}
        {%- macro szam(x) -%}{{ ('%.3f' | format(x | float)).rstrip('0').rstrip('.').replace('.', ',') }}{%- endmacro -%}
        {%- if sz in ['A mérő', 'H mérő', 'Gáz mérő'] -%}{%- set e = e | selectattr('mero', 'eq', 'G' if sz == 'Gáz mérő' else sz[0]) | list -%}
        {%- elif sz in ['Éves leolvasás', 'Mérőcsere'] -%}{%- set e = e | selectattr('tipus', 'eq', sz) | list -%}{%- endif -%}
        {%- set e = e | sort(attribute='datum', reverse=true) -%}
        <style>
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{text-align:left;color:var(--secondary-text-color);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--divider-color)}
        td{padding:5px 6px;border-bottom:1px solid var(--divider-color);vertical-align:top}
        td.n{text-align:right;white-space:nowrap}
        td .s{white-space:normal}
        table{table-layout:auto}
        .cs{color:var(--warning-color)}
        .s{color:var(--secondary-text-color);font-size:11px}
        </style>
        {%- if e | count == 0 -%}<div class="s" style="padding:8px">Nincs bejegyzés.</div>
        {%- else -%}
        <table><tr><th>Dátum</th><th>Mérő</th><th>Típus</th><th style="text-align:right">Óraállás</th><th style="text-align:right">Fogyasztás</th></tr>
        {%- for b in e -%}
        <tr><td>{{ b.datum }}</td><td>{{ 'Gáz' if b.mero == 'G' else b.mero }}</td>
        <td class="{{ 'cs' if b.tipus == 'Mérőcsere' else '' }}">{{ b.tipus }}{% if b.megjegyzes is defined and b.megjegyzes %}<div class="s">{{ b.megjegyzes }}</div>{% endif %}{% if b.korrekcio %}<div class="s">korr. {{ '+' if b.korrekcio > 0 else '' }}{{ szam(b.korrekcio) }} {{ 'm³' if b.mero == 'G' else 'kWh' }}</div>{% endif %}</td>
        <td class="n">{% if b.tipus == 'Mérőcsere' %}{{ szam(b.allas) }} → {{ szam(b.uj_kezdo) }}<div class="s">régi → új</div>{% else %}{{ szam(b.allas) if b.allas is not none else '–' }}{% endif %}</td>
        {#- Fogyasztás: az előző éves leolvasás óta, vagy ha nincs, az első (felszerelési) mérőcsere induló állásától;
            a köztes mérőcseréket figyelembe véve, mindig a naplóból számolva -#}
        {%- set ns = namespace(fogy=none, kezd=none, alap=none) -%}
        {%- if b.tipus == 'Éves leolvasás' and b.allas is number -%}
        {%- set elozok = osszes | selectattr('mero', 'eq', b.mero) | selectattr('tipus', 'eq', 'Éves leolvasás') | selectattr('datum', 'lt', b.datum) | sort(attribute='datum') | list -%}
        {%- set cserek = osszes | selectattr('mero', 'eq', b.mero) | selectattr('tipus', 'eq', 'Mérőcsere') | selectattr('datum', 'lt', b.datum) | sort(attribute='datum') | list -%}
        {%- if elozok -%}{%- set ns.fogy = b.allas - elozok[-1].allas -%}{%- set ns.kezd = elozok[-1].datum -%}{%- set ns.alap = elozok[-1].datum -%}
        {%- elif cserek -%}{%- set ns.fogy = b.allas - cserek[0].uj_kezdo -%}{%- set ns.kezd = cserek[0].datum -%}{%- set ns.alap = cserek[0].datum ~ '~' -%}{%- endif -%}
        {%- if ns.fogy is not none -%}{%- for c in cserek -%}
        {%- if (c.datum >= ns.alap if ns.alap[-1] != '~' else c.datum > ns.kezd) -%}{%- set ns.fogy = ns.fogy + c.allas - c.uj_kezdo -%}{%- endif -%}
        {%- endfor -%}{%- endif -%}{%- endif -%}
        <td class="n">{% if ns.fogy is not none %}{{ szam(ns.fogy) }} {{ 'm³' if b.mero == 'G' else 'kWh' }}<div class="s">{{ ns.kezd }} óta</div>{% else %}–{% endif %}</td></tr>
        {%- endfor -%}</table>
        {%- endif -%}
  - type: grid
    cards:
    - type: heading
      heading: Beállítás
      icon: mdi:cog-outline
    - type: entities
      title: Források
      entities:
      - entity: input_text.energia_forras_a
        name: A1 főmérő (entitás)
