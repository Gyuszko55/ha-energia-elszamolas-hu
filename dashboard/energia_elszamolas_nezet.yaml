      - entity: input_text.energia_forras_gaz
        name: Gáz (üres = nincs)
      - type: section
        label: Ellenőrzés
      - entity: sensor.villany_a_forras_kwh
        name: A1 forrás (× szorzó)
      - entity: sensor.villany_h_forras_kwh
        name: H forrás
      - entity: binary_sensor.h_tariff_season
        name: H-tarifa téli időszak
      - type: section
        label: Telepítés után egyszer
      - type: button
        name: Első beállítás
        icon: mdi:rocket-launch-outline
        action_name: Indítás
        tap_action:
          action: perform-action
          perform_action: script.energia_elszamolas_elso_beallitas
          confirmation:
            text: A mostani óraállásokkal indítja a folyó hónapot és a H-tarifa bontást. Folytatod?
